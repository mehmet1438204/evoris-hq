<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Evoris HQ — Komuta Merkezi</title>
<style>
  :root{
    --bg:#0a0d13; --bg2:#0d111a; --panel:#141a26; --panel2:#1b2331; --line:#26304328;
    --line2:#2a3446; --txt:#e9eef7; --mut:#8b96ac; --dim:#5c667a;
    --acc:#4f8cff; --acc-d:#2a5cc0; --gold:#ffb545; --teal:#2fd8c4;
    --ok:#36d399; --warn:#ffb020; --bad:#f06363; --purple:#b98cff;
    --rad:14px; --rad-s:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #14204010, transparent),
               radial-gradient(900px 500px at -10% 10%, #2fd8c40a, transparent), var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; font-size:15px; min-height:100vh;
  }
  a{color:var(--acc)}
  .hidden{display:none !important}

  /* ---------- LOGIN ---------- */
  #login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px}
  #login .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:30px 24px;box-shadow:0 30px 80px #0008}
  #login .logo{font-size:30px;font-weight:800;letter-spacing:-.5px;text-align:center}
  #login .logo span{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #login .tag{text-align:center;color:var(--mut);font-size:13px;margin-top:4px;margin-bottom:22px}
  #login .who{display:flex;gap:10px;margin-bottom:16px}
  #login .who button{flex:1;padding:14px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:.15s}
  #login .who button.on{border-color:var(--acc);background:#4f8cff18;box-shadow:0 0 0 3px #4f8cff18}
  #login .who button small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}

  /* ---------- LAYOUT ---------- */
  .app{display:flex;min-height:100vh}
  aside{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line2);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  aside .b{display:flex;align-items:center;gap:9px;padding:0 8px 16px;font-weight:800;font-size:17px;letter-spacing:-.3px}
  aside .b .d{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  aside .b span{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  aside nav{display:flex;flex-direction:column;gap:2px}
  aside nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:var(--mut);font-family:inherit;font-size:14px;padding:10px 11px;border-radius:10px;cursor:pointer;transition:.12s}
  aside nav button .ic{font-size:17px;width:22px;text-align:center}
  aside nav button:hover{background:var(--panel);color:var(--txt)}
  aside nav button.active{background:linear-gradient(90deg,#4f8cff1f,transparent);color:var(--txt);box-shadow:inset 2px 0 0 var(--acc)}
  aside .foot{margin-top:14px;padding:12px 8px 0;border-top:1px solid var(--line2)}
  .whoami{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mut);padding:6px 8px}
  .whoami .av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f;font-size:13px}

  main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1100px;margin:0 auto;width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .topbar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.4px}
  .topbar .sub{color:var(--mut);font-size:13px;margin-top:2px}
  .sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line2);padding:7px 11px;border-radius:20px;cursor:pointer}
  .sync .d{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .sync.on .d{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .sync.off .d{background:var(--warn)}
  .sync.err .d{background:var(--bad)}

  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--rad);padding:18px;margin-bottom:16px}
  .card h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .card h3{font-size:12px;color:var(--mut);font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:.7px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:15px;text-align:center}
  .stat .big{font-size:23px;font-weight:800;color:var(--acc);line-height:1.1}
  .stat .lbl{font-size:11px;color:var(--mut);margin-top:5px}
  .stat.gold .big{color:var(--gold)} .stat.ok .big{color:var(--ok)} .stat.teal .big{color:var(--teal)} .stat.bad .big{color:var(--bad)}
  .pbar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px;border:1px solid var(--line2)}
  .pbar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--teal));width:0%;transition:width .5s}
  .pbar.gold>div{background:linear-gradient(90deg,var(--gold),#ff7a45)}
  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line2);color:var(--mut);font-weight:600}
  .pill.p-ajans{color:var(--acc);border-color:#2a4a7a} .pill.p-egitim{color:var(--gold);border-color:#6a541f}
  .pill.p-youtube{color:var(--bad);border-color:#6a2a2a} .pill.p-x{color:var(--teal);border-color:#1f5a52}
  .pill.p-insta{color:var(--purple);border-color:#4a2f6a} .pill.p-sistem{color:var(--ok);border-color:#1f5a40}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line2);color:var(--txt)}
  .btn.gold{background:var(--gold);color:#1a1205} .btn.teal{background:var(--teal);color:#04140f}
  .btn.bad{background:none;border:1px solid #6a2a2a;color:var(--bad)}
  .btn.sm{padding:7px 12px;font-size:12px} .btn.full{width:100%} .btn.xs{padding:5px 9px;font-size:11px}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;width:100%}
  input:focus,select,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{resize:vertical;min-height:64px}
  label.fl{font-size:12px;color:var(--mut);display:block;margin:12px 0 6px;font-weight:600}
  .muted{color:var(--mut);font-size:13px}
  .dim{color:var(--dim)}
  hr{border:none;border-top:1px solid var(--line2);margin:16px 0}
  .task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line2)}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--ok);cursor:pointer}
  .task label{flex:1;cursor:pointer;font-size:14px}
  .task.done label{color:var(--dim);text-decoration:line-through}
  .swipe{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:14px;margin-bottom:11px;position:relative}
  .swipe .cat{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);font-weight:800}
  .swipe p{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
  .swipe .copy{position:absolute;top:12px;right:12px}
  .acc{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;margin-bottom:10px;overflow:hidden}
  .acc summary{cursor:pointer;font-weight:700;font-size:14px;padding:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::after{content:"+";color:var(--mut);font-size:18px}
  .acc[open] summary::after{content:"−"}
  .acc .body{padding:0 14px 14px;font-size:13.5px;color:#cdd5e4}
  .acc .body p{margin:0 0 10px;white-space:pre-wrap}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ok);color:#04140c;padding:11px 20px;border-radius:30px;font-weight:700;font-size:13px;z-index:150;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--mut)}
  .quote{font-style:italic;color:var(--mut);font-size:14px;border-left:3px solid var(--gold);padding-left:13px;margin:0}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:720px){.kanban{grid-template-columns:1fr}}
  .kcol{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px;min-height:120px}
  .kcol h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);display:flex;justify-content:space-between}
  .kcard{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:10px;margin-bottom:8px;font-size:13px;cursor:grab}
  .kcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
  .inc-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
  .inc-item:last-child{border-bottom:none}
  .lead{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:13px;margin-bottom:10px}
  .lead .nm{font-weight:700;font-size:14px}
  .lead .st{font-size:11px;padding:2px 8px;border-radius:20px}
  .st.yeni{background:#4f8cff22;color:var(--acc)} .st.arandi{background:#ffb54522;color:var(--gold)}
  .st.toplanti{background:#b98cff22;color:var(--purple)} .st.kapandi{background:#36d39922;color:var(--ok)} .st.kayip{background:#f0636322;color:var(--bad)}
  .note{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:13px;margin-bottom:10px;white-space:pre-wrap;font-size:14px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:20px}
  .bars .b{flex:1;background:linear-gradient(180deg,var(--acc),var(--teal));border-radius:4px 4px 0 0;min-height:3px;position:relative}
  .bars .b span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--mut)}
  .callflow{counter-reset:step}
  .callflow .s{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
  .callflow .s:last-child{border:none}
  .callflow .s .n{counter-increment:step;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--gold)}
  .callflow .s .n::before{content:counter(step)}
  .callflow .s .c b{color:var(--txt)} .callflow .s .c{font-size:13.5px;color:#cdd5e4}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#4f8cff18;color:var(--acc);border:1px solid #2a4a7a;margin-left:6px}

  /* ---------- MOBILE NAV ---------- */
  .mtop{display:none}
  #mnav{display:none}
  @media(max-width:860px){
    aside{display:none}
    main{padding:0 15px 90px;max-width:100%}
    .mtop{display:flex;position:sticky;top:0;z-index:40;background:rgba(10,13,19,.94);backdrop-filter:blur(10px);
      align-items:center;justify-content:space-between;padding:14px 4px calc(12px);margin:0 -15px 16px;padding-left:15px;padding-right:15px;border-bottom:1px solid var(--line2)}
    .mtop .b{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
    .mtop .b span{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .mtop .b .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
    .topbar{margin-top:4px}
    .topbar h1{font-size:19px}
    #mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(20,26,38,.97);backdrop-filter:blur(12px);
      border-top:1px solid var(--line2);padding:6px 2px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
    #mnav button{flex:0 0 auto;min-width:62px;background:none;border:none;color:var(--mut);font-size:9.5px;padding:7px 4px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
    #mnav button .ic{font-size:18px;line-height:1}
    #mnav button.active{color:var(--acc)}
    .kanban{grid-template-columns:1fr}
  }
  .sheet{position:fixed;inset:0;z-index:120;background:#0007;display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .inner{background:var(--panel);border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px}
  @media(min-width:721px){.sheet{align-items:center}.sheet .inner{border-radius:18px}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="box">
    <div class="logo"><span>Evoris HQ</span></div>
    <div class="tag">Komuta Merkezi · Mehmet & Hatice</div>
    <div class="who" id="whoRow"></div>
    <label class="fl">Şifre</label>
    <input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:16px"><button class="btn full" onclick="doLogin()">Giriş Yap</button></div>
    <p class="muted" style="text-align:center;margin:14px 0 0;font-size:11.5px">
      İlk giriş — Mehmet: <b>mehmet2026</b> · Hatice: <b>hatice2026</b><br>Girişten sonra Ayarlar'dan değiştir.
    </p>
    <p id="loginErr" class="muted hidden" style="text-align:center;color:var(--bad);margin-top:10px"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="app hidden" id="app">
  <aside>
    <div class="b"><span class="d"></span> <span>Evoris HQ</span></div>
    <nav id="dnav"></nav>
    <div class="foot">
      <div class="whoami"><div class="av" id="wAv">M</div><div><div id="wName" style="color:var(--txt);font-weight:600">Mehmet</div><div id="wRole" style="font-size:11px">Kurucu · Admin</div></div></div>
      <button class="btn ghost sm full" style="margin-top:8px" onclick="logout()">Çıkış</button>
    </div>
  </aside>

  <main>
    <div class="mtop">
      <div class="b"><span class="d"></span> <span>Evoris HQ</span></div>
      <div class="sync" id="syncPill2" onclick="pushNow()"><span class="d"></span><span id="syncTxt2">Yerel</span></div>
    </div>

    <div class="topbar">
      <div>
        <h1 id="vTitle">Komuta Merkezi</h1>
        <div class="sub" id="vSub"></div>
      </div>
      <div class="sync" id="syncPill" onclick="pushNow()"><span class="d"></span><span id="syncTxt">Yerel mod</span></div>
    </div>

    <div id="views"></div>
  </main>
</div>

<nav id="mnav"></nav>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="inner" id="sheetInner"></div></div>

<script>
/* ============================================================
   EVORIS HQ — tek dosya komuta merkezi
   Depolama: Supabase bulut (varsa) + localStorage yedek
   ============================================================ */

/* ---------- KULLANICILAR (varsayılan) ---------- */
const DEFAULT_USERS = [
  {id:"mehmet", name:"Mehmet", role:"Kurucu · Admin", admin:true, pass:"mehmet2026", av:"M"},
  {id:"hatice", name:"Hatice", role:"Operasyon · Satış", admin:false, pass:"hatice2026", av:"H"}
];

/* ---------- VARSAYILAN DURUM ---------- */
const DEFAULT = {
  v:2,
  startDate: todayStr(),
  users: DEFAULT_USERS,
  supabase:{url:"", key:""},
  goals:{followX:0, followIG:0, followYT:0, subs:0, subPrice:400, mrr:0},
  debt:{start:1000000, paid:0},
  focus:{}, streak:0, lastDone:"",
  tasksDone:{}, dayDone:{}, planDone:{},
  income:[], expense:[],
  content:[], leads:[], notes:[], meetings:[],
  kanban:{todo:[],doing:[],done:[]},
  customHooks:[],
  updatedAt:0, updatedBy:""
};

let D = {...DEFAULT};
let ME = null;
let SB = null;             // supabase-lite client
let syncState = "local";   // local | on | off | err
let pushTimer = null;

/* ---------- YARDIMCI ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function yestStr(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nowMs(){return Date.now()}
function fmt(n){return (Number(n)||0).toLocaleString("tr-TR")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function daysSince(){const s=new Date(D.startDate);const n=new Date();return Math.max(1,Math.floor((n-s)/864e5)+1)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1500)}

/* ---------- KALICILIK ---------- */
function saveLocal(){localStorage.setItem("evorisHQ",JSON.stringify(D))}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem("evorisHQ"));if(r)D={...DEFAULT,...r,goals:{...DEFAULT.goals,...(r.goals||{})},debt:{...DEFAULT.debt,...(r.debt||{})},kanban:{...DEFAULT.kanban,...(r.kanban||{})},supabase:{...DEFAULT.supabase,...(r.supabase||{})}}}catch(e){}}

function touch(){D.updatedAt=nowMs();D.updatedBy=ME?ME.id:"";}
function save(){touch();saveLocal();schedulePush()}

/* ---------- SUPABASE-LITE (REST, kütüphanesiz) ----------
   Tek satırlık durum bloğu: tablo hq_state(id text pk, data jsonb, updated_at int8)
------------------------------------------------------------- */
function sbInit(){
  const {url,key}=D.supabase||{};
  if(url&&key){SB={url:url.replace(/\/+$/,""),key};return true}
  SB=null;return false;
}
async function sbGet(){
  if(!SB)return null;
  const r=await fetch(SB.url+"/rest/v1/hq_state?id=eq.evoris&select=data,updated_at",{
    headers:{apikey:SB.key,Authorization:"Bearer "+SB.key}});
  if(!r.ok)throw new Error("GET "+r.status);
  const j=await r.json();return j&&j[0]?j[0]:null;
}
async function sbPut(){
  if(!SB)return;
  const body=[{id:"evoris",data:D,updated_at:D.updatedAt}];
  const r=await fetch(SB.url+"/rest/v1/hq_state?on_conflict=id",{
    method:"POST",
    headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify(body)});
  if(!r.ok)throw new Error("PUT "+r.status);
}
function setSync(s){syncState=s;document.querySelectorAll("#syncPill,#syncPill2").forEach(p=>{p.className="sync "+(s==="on"?"on":s==="err"?"err":s==="off"?"off":"");});
  const txt=s==="on"?"Bulut · eşitlendi":s==="err"?"Bulut hatası":s==="off"?"Çevrimdışı":"Yerel mod";
  const t1=document.getElementById("syncTxt"),t2=document.getElementById("syncTxt2");if(t1)t1.textContent=txt;if(t2)t2.textContent=s==="on"?"Bulut":s==="err"?"Hata":s==="off"?"Offline":"Yerel";}

async function initialSync(){
  if(!sbInit()){setSync("local");return}
  try{
    const remote=await sbGet();
    if(remote&&remote.data){
      const rd=remote.data;
      // en güncel kazanır
      if((rd.updatedAt||0) >= (D.updatedAt||0)){
        const keepSb=D.supabase; // yerel supabase anahtarını koru
        D={...DEFAULT,...rd,supabase:keepSb.url?keepSb:rd.supabase};
        saveLocal();
      }else{
        await sbPut();
      }
    }else{
      await sbPut();
    }
    setSync("on");renderAll();
  }catch(e){setSync("err");}
}
function schedulePush(){
  if(!SB){setSync("local");return}
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow,900);
}
async function pushNow(){
  if(!SB){setSync("local");return}
  try{
    // önce uzaktan çek: karşı taraf daha yeniyse birleştir (basit son-yazan-kazanır güvenliği)
    const remote=await sbGet();
    if(remote&&remote.data&&(remote.data.updatedAt||0)>(D.updatedAt||0)){
      const keepSb=D.supabase;D={...DEFAULT,...remote.data,supabase:keepSb};saveLocal();renderAll();toast("Ortaktan yeni veri geldi ↺");setSync("on");return;
    }
    await sbPut();setSync("on");
  }catch(e){setSync("err")}
}

/* Haftanın günü → o gün hangi kanal(lar) */
const WEEKDAY_PLAN={
 1:["ig","x"], 2:["x"], 3:["yt","x"], 4:["ig","x"], 5:["x"], 6:["ig","x"], 0:["yt","x"]
};
const GUN_ADI=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

function buildDay(off){ // off = 1..90
  const d=new Date(D.startDate); d.setDate(d.getDate()+(off-1));
  const wkIdx=Math.min(12,Math.floor((off-1)/7));
  const wk=WEEKS[wkIdx];
  const dow=d.getDay();
  const chans=WEEKDAY_PLAN[dow]||["x"];
  const items=[];
  // rotasyon: hafta içindeki gün sırasına göre konu seç
  const posInWeek=(off-1)%7;
  chans.forEach(c=>{
    if(c==="ig") items.push({c:"ig",label:"Instagram Reels",text:wk.ig[posInWeek%wk.ig.length]});
    if(c==="yt") items.push({c:"yt",label:"YouTube (EN)",text:wk.yt});
    if(c==="x"){
      const thread=wk.x[posInWeek%wk.x.length];
      items.push({c:"x",label:"X · Thread konusu",text:thread});
      items.push({c:"x",label:"X · Günlük tweet (hazır)",text:DAILY_TWEETS[(off-1)%DAILY_TWEETS.length],ready:true});
    }
  });
  return {off,date:d,dow,wk:wkIdx+1,theme:wk.theme,items};
}
function planTodayOffset(){const s=new Date(D.startDate);const n=new Date();const off=Math.floor((n-s)/864e5)+1;return off;}

  const u=D.users.find(x=>x.id===window._pick);

/* ---------- 90 GÜNLÜK PLAN ---------- */
function vPlan(el){
  const todayOff=planTodayOffset();
  let done=0;for(let i=1;i<=90;i++)if(D.planDone["d"+i])done++;
  const chanColor={ig:"p-insta",x:"p-x",yt:"p-youtube"};
  let h=`<div class="card"><h2>90 Günlük Gün-Gün Plan</h2><p class="muted" style="margin-top:4px">Instagram (gelişim) · X (kripto eğitim) · YouTube (İngilizce). Her gün ne paylaşacağın hazır. Bugünkü satır vurgulu. Telegram botun da her sabah bunu telefonuna yollar.</p>
    <div class="pbar" style="margin-top:10px"><div style="width:${Math.round(done/90*100)}%"></div></div>
    <div class="muted" style="margin-top:6px;font-size:12px">${done}/90 gün işaretlendi · Bugün: ${todayOff>=1&&todayOff<=90?("Gün "+todayOff):"plan aralığı dışında"}</div></div>`;
  for(let w=0;w<13;w++){
    const wk=WEEKS[w];
    const isCurWeek=todayOff>=1&&Math.floor((todayOff-1)/7)===w;
    h+=`<details class="acc" ${isCurWeek?"open":""}><summary>Hafta ${wk.n} — ${esc(wk.theme)} ${isCurWeek?'<span class="badge">BU HAFTA</span>':''}</summary><div class="body" style="padding:0 10px 10px">`;
    for(let dd=0;dd<7;dd++){
      const off=w*7+dd+1; if(off>90)break;
      const day=buildDay(off);
      const isToday=off===todayOff;
      const dk="d"+off, on=!!D.planDone[dk];
      h+=`<div style="border:1px solid ${isToday?'var(--gold)':'var(--line2)'};border-radius:10px;padding:11px;margin-bottom:8px;background:${isToday?'#ffb5450d':'var(--panel)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:9px"><input type="checkbox" ${on?'checked':''} onchange="togglePlan('${dk}')" style="width:19px;height:19px;accent-color:var(--ok)"><b style="font-size:13px">Gün ${off} · ${GUN_ADI[day.dow]}</b> <span class="muted" style="font-size:11px">${day.date.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</span></div>
          ${isToday?'<span class="badge">BUGÜN</span>':''}
        </div>`;
      day.items.forEach(it=>{
        h+=`<div class="swipe" style="margin-bottom:7px;padding:10px"><span class="cat"><span class="pill ${chanColor[it.c]}" style="font-size:9px;padding:1px 7px">${it.label}</span></span><button class="btn ghost xs copy" onclick="cp(this,${jsq(it.text)})" style="position:absolute;top:9px;right:9px">Kopyala</button><p style="margin:6px 0 0;font-size:13px">${esc(it.text)}${it.ready?' <span class="dim" style="font-size:11px">← direkt yapıştır</span>':''}</p></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div></details>`;
  }
  h+=`<div class="card"><h3>Nasıl kullanılır</h3><p class="muted" style="margin-top:0">Bu plan bir iskelet — her satır bir konu. Tam metni için o konuyu <b>Cephanelik</b>'teki uygun Claude promptuna yapıştır (reels script / X thread / YouTube script). "Günlük tweet (hazır)" satırları zaten yapıştırmaya hazır. İşaretlediğin günler yukarıdaki bardan sayılır.</p></div>`;
  el.innerHTML=h;
}

    <div>${D.users.map((u,i)=>`<div class="lead"><div style="display:flex;justify-content:space-between;align-items:center"><span class="nm">${esc(u.name)} ${u.admin?'<span class="badge">ADMIN</span>':''}</span>${u.id!=='mehmet'?`<button class="btn bad xs" onclick="delUser(${i})">Çıkar</button>`:'<span class="muted" style="font-size:11px">kalıcı</span>'}</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(u.role)} · şifre: ${esc(u.pass)}</div></div>`).join("")}</div>`;
}
function addUser(){
  const name=document.getElementById("tName").value.trim();const role=document.getElementById("tRole").value.trim()||"Ekip";const pass=document.getElementById("tPass").value.trim();
  if(!name||!pass){toast("İsim + şifre gir");return}
  const id=name.toLowerCase().replace(/[^a-z0-9]/g,"")+ (D.users.length);
  D.users.push({id,name,role,admin:document.getElementById("tAdmin").checked,pass,av:name[0].toUpperCase()});
  save();renderView("team");toast("Kişi eklendi")
}
function delUser(i){if(D.users[i].id==="mehmet")return;if(!confirm(D.users[i].name+" çıkarılsın mı?"))return;D.users.splice(i,1);save();renderView("team")}

/* ---------- SETTINGS ---------- */
function vSettings(el){
  el.innerHTML=`
   <div class="card"><h2>☁️ Bulut (Supabase)</h2><p class="muted" style="margin-top:4px">Verileri buluta bağla — Mehmet ve Hatice her cihazdan aynı veriyi görür. Kurulum rehberi PDF'inde adım adım anlatıldı.</p>
     <label class="fl">Supabase Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(D.supabase.url)}">
     <label class="fl">Supabase anon (public) key</label><input id="sbKey" placeholder="eyJhbGci..." value="${esc(D.supabase.key)}">
     <div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="saveSupabase()">Bağla & Eşitle</button><button class="btn ghost" onclick="pushNow()">↻ Şimdi eşitle</button></div>
     <p class="muted" style="font-size:12px;margin-top:10px">Durum: <b id="sbStatus">${syncState==="on"?"Bağlı ✓":syncState==="err"?"Hata":"Yerel"}</b></p></div>

   <div class="card"><h3>🔒 Şifre Değiştir (${esc(ME.name)})</h3>
     <label class="fl">Yeni şifre</label><input type="password" id="npw" placeholder="Yeni şifre">
     <div style="margin-top:10px"><button class="btn full" onclick="changePw()">Şifreyi Değiştir</button></div></div>

   <div class="card"><h3>💾 Yedek</h3><p class="muted" style="margin-top:0;font-size:12px">Bulut kapalıysa cihazlar arası veriyi bununla taşı.</p>
     <div class="row"><button class="btn ghost sm" style="flex:1" onclick="exportData()">⬇ Yedek indir</button><button class="btn ghost sm" style="flex:1" onclick="document.getElementById('imp').click()">⬆ Yedek yükle</button></div>
     <input type="file" id="imp" accept=".json" class="hidden" onchange="importData(event)"></div>

   <div class="card"><h3>Başlangıç Tarihi</h3><label class="fl">90 günün 1. günü</label><input type="date" id="startD" value="${D.startDate}"><div style="margin-top:10px"><button class="btn ghost sm full" onclick="D.startDate=document.getElementById('startD').value||todayStr();save();renderView('settings');toast('Güncellendi')">Kaydet</button></div></div>

   <div class="card"><h3 style="color:var(--bad)">Tehlikeli Bölge</h3><button class="btn bad sm full" onclick="if(confirm('TÜM veriler bu cihazdan silinsin mi? (Bulut varsa oradan geri gelebilir)')){localStorage.removeItem('evorisHQ');location.reload()}">Yerel veriyi sıfırla</button></div>`;
}
function saveSupabase(){D.supabase.url=document.getElementById("sbUrl").value.trim();D.supabase.key=document.getElementById("sbKey").value.trim();saveLocal();if(sbInit()){toast("Bağlanıyor...");initialSync().then(()=>{const s=document.getElementById("sbStatus");if(s)s.textContent=syncState==="on"?"Bağlı ✓":"Hata"})}else{setSync("local");toast("URL + key gerekli")}}
function changePw(){const v=document.getElementById("npw").value;if(v.length<4){toast("En az 4 karakter");return}const u=D.users.find(x=>x.id===ME.id);u.pass=v;ME.pass=v;save();document.getElementById("npw").value="";toast("Şifre değişti 🔒")}

/* ---------- ORTAK ---------- */
function delItem(key,i){D[key].splice(i,1);save();renderView(currentView)}
function exportData(){const b=new Blob([JSON.stringify(D)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="evoris-yedek-"+todayStr()+".json";a.click();URL.revokeObjectURL(u);toast("Yedek indirildi")}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);D={...DEFAULT,...j};save();location.reload()}catch(x){alert("Geçersiz dosya")}};r.readAsText(f)}

/* ---------- BAŞLAT ---------- */
loadLocal();
renderLogin();
// oturum hatırla
const savedMe=sessionStorage.getItem("evorisMe");
if(savedMe){const u=D.users.find(x=>x.id===savedMe);if(u){ME=u;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");bootApp();}}
</script>
</body>
</html>
